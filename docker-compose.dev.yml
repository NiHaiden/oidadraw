# Local development: Postgres for `pnpm dev` (the app itself runs on the host).
#   pnpm dev      # start Postgres, then Vite :3000 + sync server :3001
#   pnpm db:down  # stop (data is kept)
# Isolated from the production Compose project, including its database volume.
name: kritzlboard-dev
services:
  db:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5441:5432"
    environment:
      POSTGRES_USER: kritzlboard
      POSTGRES_PASSWORD: kritzlboard
      POSTGRES_DB: kritzlboard
    volumes:
      - kritzlboard-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kritzlboard"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kritzlboard-pgdata:
